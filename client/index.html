<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aetherian Vault</title>
    <!-- Include ethers.js library -->
    <script src="https://cdn.ethers.io/lib/ethers-5.2.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #1a1a1a; color: white; }
        .container { text-align: center; padding: 40px; background-color: #2c2c2c; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #00ffff; margin-bottom: 20px; }
        #connect-wallet-btn { font-size: 18px; color: #1a1a1a; background-color: #00ffff; border: none; padding: 12px 24px; border-radius: 5px; cursor: pointer; transition: background-color 0.3s; }
        #connect-wallet-btn:hover { background-color: #fff; }
        #error-message { color: #ff4d4d; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Aetherian Vault</h1>
    <p>Connect your Polygon wallet to play.</p>
    <button id="connect-wallet-btn">Connect Wallet</button>
    <p id="error-message"></p>
</div>

<script src="app.js"></script>

</body>
</html>
